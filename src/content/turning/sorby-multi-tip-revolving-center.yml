summary: >-
  A tailstock live center with six interchangeable points, so the right support for the job is always in the
  case. Cup points for general spindle work, cones for hollow and drilled work, and a 5/16" through hole for
  boring down the axis of a piece. Seven pieces in a fitted locking case.
specs:
  - label: Taper
    value: "#2 Morse, fits the 2014B tailstock"
  - label: Pieces
    value: Revolving center body plus 6 interchangeable points
  - label: Points
    value: Cup point, small cone point, large cone point, tapered cup point, cup chuck point, hollow cup point
  - label: Through hole
