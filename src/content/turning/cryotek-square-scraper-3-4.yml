summary: >-
  A flat scraper with a straight, square end. It makes flat surfaces and crisp inside corners: the bottoms of
  boxes, flat recesses, tenon shoulders, and straight sections on spindles. It is also a good blank to regrind
  into whatever special scraper profile a job calls for.
