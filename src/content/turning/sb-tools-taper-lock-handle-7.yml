name: Classic Taper Lock Handle, 7"
brand: SB Tools (Stuart Batty)
model: HAN-48-7
category: handle
vendor: SB Tools
url: https://stuartbattytools.com/products/48in-handle
purchased: '2026-11-12'
image: sb-tools-taper-lock-handle-7.jpg
summary: >-
  The shortest handle in Stuart Batty's taper lock system. A 7" carbon fiber and fiberglass composite grip
  that accepts any blade fitted with an SB taper lock bolster and locks or releases it by hand in a few
  seconds. A palm-sized handle for small tools and close work, not for leverage.
specs:
  - label: Length
    value: 7" (the shortest of ten lengths, 7" to 48")
  - label: Grip
    value: Six-lobed, 1.3" diameter, will not roll off the bench
  - label: Construction
    value: Woven carbon fiber outer layer over woven and straight fiberglass, polyurethane bonded
  - label: Metal parts
    value: Anodized aluminum
  - label: Blade fitting
    value: SB taper lock bolster, locked and released by hand with no tools
  - label: Bolster hole sizes
    value: Round holes from 3/8" to 7/8" (0.380", 0.515", 0.640", 0.750", 0.875"). Square and rectangular tangs fit with glue-in inserts.
  - label: Included
    value: Bench wrench for semi-permanent bolster locking
  - label: Connecting
    value: Can be the rear handle on an SB Connectable Handle using the Handle Connector. Classic handles do not join to each other.
sections:
  - heading: What it's for
    paragraphs:
      - >-
        This is a handle only. It carries any blade that has an SB taper lock bolster on its tang. No SB blades
        or bolsters are logged in the shop yet, so what goes in it is still open.
    bullets:
      - Small tools and close-in work where a long handle is in the way, such as detail tools, small scrapers, and work near the tailstock or inside a box.
      - A second handle body, so a blade can stay mounted and ready while another handle carries the tool in use.
      - Extra length on a Connectable Handle, joined with the Handle Connector, if you add one later.
      - Not a handle for bowl gouges hanging far over the rest. At 7" there is almost no leverage behind the tool rest.
  - heading: How the taper lock works
    bullets:
      - The blade does not go into the handle directly. A bolster is fixed to the blade's tang, and the bolster's taper seats in the front of the handle and locks there.
      - Locking and releasing is done by hand, with no set screws or hex keys. SB quotes under 10 seconds to swap one blade for another.
      - Bolsters are sold separately in nickel-coated gray iron, with round holes from 3/8" to 7/8". SB lists more than 50 blade fit options across the bolster and insert range.
      - A bolster is bonded to a blade with two-part epoxy. Dry-fit first, go easy on the epoxy so it does not run through the air hole onto the locking threads, and keep acetone on hand to wipe off the excess before it sets.
      - SB suggests 5 minute epoxy for a single round bar and a 20 minute or slower epoxy for square or rectangular blades, which go in with a glue-in insert.
      - The bench wrench that comes with the handle is for locking a bolster in semi-permanently when a blade is going to live in one handle.
  - heading: How to use it
    bullets:
      - Wipe the bolster taper and the handle socket clean before fitting a blade. Dust or grit in the taper keeps it from seating.
      - Lock the blade in, then try to twist and pull it by hand before you turn the lathe on.
      - Take the handle off to sharpen. A bare blade is easier to control on the platform or in a jig than one with a handle attached.
      - With a handle this short, keep the tool overhang small and brace the handle in your palm or against your forearm. Use it for light, controlled cuts.
  - heading: Care
    bullets:
      - Keep the taper and the locking threads free of dust, finish, and epoxy.
      - Do not use the handle as a mallet or pry with it. The composite is strong along its length but the end fittings are aluminum.
      - Store the bench wrench with the handle so a semi-permanently locked bolster can be released.
  - heading: Common mistakes
    bullets:
      - Expecting a tool to drop straight in. A blade without an SB bolster on its tang will not lock into this handle.
      - Ordering the wrong bolster hole size. Measure the tang with calipers and match it to the listed hole diameter, not the nominal tool size.
      - Using too much epoxy when bonding a bolster, which can foul the locking threads.
      - Putting a big gouge in it for heavy cuts. Use a long handle when the tool has to reach over the rest.
