purchased: '2026-11-16'
image: oneway-exterior-curved-rest.jpg
summary: >-
  A 12" stainless steel rest with a gentle curve that wraps around the outside of a bowl, so the gouge stays
  close to the wood from foot to rim and the profile can be cut in one pass without moving the banjo. The
  outside counterpart to the Hurricane 5" curved rest, which goes inside.
specs:
  - label: Blade width
    value: 12"
  - label: Post diameter
    value: 1"
  - label: Post height
    value: 4-1/2"
  - label: Overall height
    value: 6"
  - label: Construction
    value: Stainless steel blade welded to a stainless post
  - label: Made in
    value: Stratford, Ontario, Canada
sections:
  - heading: What it's for
    bullets:
      - Shaping the outside of medium and large bowls. A straight rest like the Robust 12" touches the curve at one point and leaves a growing gap toward each end; this one follows the profile so the overhang stays short along the whole cut.
      - One continuous pass from foot to rim, which is what makes a fair curve. No stopping to move the banjo and no ridge where two cuts meet.
      - Both the first green-wood roughing and the final finishing cut on the outside.
      - Shear scraping the outside with the gouge wing or a scraper, again in one sweep.
      - The Hurricane 5" curved rest is for bowl interiors. This is for exteriors. The Robust stays on for spindles and flat faces.
  - heading: Setting it
    bullets:
      - With the lathe stopped, put the hollow side of the curve toward the bowl and angle the banjo so the blade follows the profile with an even gap, about 1/4" to 1/2".
      - Set the height so the gouge edge cuts at center. With the handle dropped for a bevel-rubbing cut that puts the top of the rest a little below center.
      - Rotate the blank a full turn by hand before starting. A rough blank can clear at one point and hit the ends of the blade at another.
      - Lock both the banjo and the post firmly. A long curved blade puts more twisting load on the post than a short straight rest when you cut near the ends.
      - Re-set as the shape develops. The curve is fixed, so it will match some part of the profile well and the rest of it only roughly; put the close fit where you are cutting.
      - The 4-1/2" post fits the 2014B banjo's 1" bore. With the bed extension in the low position the banjo sits lower, so check that the top still reaches center there; Oneway sells a long-post version (6-1/2" post) for that.
  - heading: Care
    bullets:
      - Stainless does not rust, but it is softer than the hardened top on the Robust and will pick up nicks from tool corners. Dress the top with a fine file or 320 grit paper on a block when tools stop sliding freely.
      - A little paste wax on the top edge helps the gouge glide.
      - Wipe off wet shavings from green wood anyway. Tannin stains the banjo and bed even if it leaves the rest alone.
  - heading: Common mistakes
    bullets:
      - Starting the lathe without turning the blank by hand. The ends of a 12" blade reach further around the work than you expect.
      - Using it for bowl interiors. The curve goes the wrong way, and the ends end up far from the wall.
      - Leaving it in one position for the whole outside. It saves most banjo moves, not all of them.
      - Using it on spindles. Only the ends or only the middle are near the work.
