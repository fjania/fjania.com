purchased: '2026-11-23'
image: carter-and-son-handle-12.jpg
summary: >-
  A 12" polished aluminum handle with a 3/4" bore that holds any Carter and Son tool by its round tang with
  two set screws. It came with the 1" spear scraper, ordered as the scraper and 12" handle together, and it
  can carry other Carter and Son tools as they are added.
specs:
  - label: Length
    value: 12" (also made in 8", 10", 16" and 20")
  - label: Bore
    value: 3/4"
  - label: Material
    value: Aluminum, polished and engraved
  - label: Tool retention
    value: Two set screws, tool seated 3" into the handle
  - label: Set screw key
    value: 5/32" hex
  - label: Smaller tangs
    value: Carter and Son adapter sleeves bring the 3/4" bore down to 5/8", 1/2" or 3/8" (sold separately, each with its own two set screws)
  - label: Made in
    value: USA (engraved "Hand Made in Seattle")
sections:
  - heading: What it's for
    paragraphs:
      - >-
        This is the handle on the 1" spear scraper. The scraper's 3/4" round tang goes straight into the bore
        with no adapter. Because the tool is held by set screws and not glued, the same handle can take
        another Carter and Son tool in under a minute.
    bullets:
      - Holding the spear scraper for detail and shear scraping work, where a 12" handle gives control close to the rest.
      - Carrying any other Carter and Son tool with a 3/4" tang directly, or a 5/8", 1/2" or 3/8" tang with the matching adapter sleeve.
      - Coming off for sharpening, so the bare blade goes to the grinder platform without a handle in the way.
      - Not a long-reach handle. For a tool that hangs far over the rest, Carter and Son make the same handle in 16" and 20".
  - heading: How to use it
    bullets:
      - Back both set screws out until the bore is clear, slide the tang in until it stops, then tighten both screws with the 5/32" T-handle hex key. The tool should sit about 3" into the handle.
      - Tighten the screws evenly, then try to twist and pull the blade by hand before turning the lathe on.
      - If the tang has a flat, turn the tool so the screws bear on it. That also sets which way the edge faces relative to the engraving, so it goes back the same way each time.
      - With an adapter sleeve, the sleeve goes into the handle first and has its own two set screws for the tool.
      - Aluminum is smooth and cold. If the grip feels slick with dusty hands, cohesive handle wrap is the usual fix and comes off without residue.
  - heading: Care
    bullets:
      - Check both set screws at the start of a session. Vibration from scraping can work them loose.
      - Keep the 5/32" T-handle key with the handle. Use the right size key and seat it fully so the screw sockets do not round out.
      - Blow the dust out of the bore before fitting a tool so the tang seats fully.
      - Aluminum dents and scratches easily. Do not use the handle as a mallet, and do not let it roll off the bench.
  - heading: Common mistakes
    bullets:
      - Tightening one screw and forgetting the other. One screw lets the blade rock in the bore.
      - Seating the tang only part way to gain reach. Less tang in the bore means less support and more chatter.
      - Putting a smaller-tang tool in the 3/4" bore without the adapter sleeve and relying on the screws to center it.
      - Using a worn or wrong-size hex key and stripping a screw socket. Replacement set screws are available from Carter and Son.
