summary: >-
  The longer carbon fiber handle in the Bowl Turning Package. Ashley Harwood recommends the 23" length for the
  5/8" Push Cut bowl gouge and the 3/4" Finisher bottom bowl gouge, where the tool reaches a long way over the
  rest. Same twist-lock bolster system and in-handle tool storage as the 16" handle.
specs:
  - label: Length
    value: 23" (one of six stock lengths)
  - label: Grip
    value: Round, 1.4" diameter
  - label: End fitting
    value: 1.5" hex aluminum, keeps the handle from rolling
  - label: Construction
    value: Ten layers of axial and co-axial carbon fiber mesh composite, flex strength 100 to 150 ksi
  - label: Balance
    value: Weighted toward the front, to keep pressure on the tool rest
  - label: Tool fitting
    value: AH bolster, locked and released by hand (U.S. Patent 12427643). Also accepts SB Tools bolsters.
  - label: Bolsters in the package
    value: 1/2", 5/8", 3/8" and 3/4"
  - label: Made in
    value: USA, from USA-made materials
sections:
  - heading: What it's for
    paragraphs:
      - >-
        This is a handle only. It carries any tool that has an AH bolster on its shank. Ashley Harwood recommends
        the 23" length for the 5/8" Push Cut gouge and the 3/4" Finisher bottom bowl gouge.
    bullets:
      - The 3/4" Finisher, for cuts across the bottom of a bowl with a lot of tool past the rest. This is its normal handle.
      - The 5/8" Push Cut gouge on deeper or larger bowls, when the 16" handle does not give enough leverage.
      - Any of the four bolstered tools fits, but the 1/2" gouge and the bedan gain nothing from the extra length.
  - heading: How the bolster system works
    bullets:
      - A bolster is fixed to the tool's shank, and the bolster seats in the front of the handle and locks with a twist. No set screws or hex keys.
      - The magnetic AH Angle Wrench from the package tightens or loosens a bolster that will not move by hand.
      - A separately bought bolster is glued to the tool with epoxy or another adhesive. The package bolsters are 1/2", 5/8", 3/8" (on the bedan) and 3/4", listed with a TDC (thin dense chrome) coating to prevent rust.
      - "Storage: turn the tool around, slide the sharp end into the handle, and twist the bolster to lock it."
      - SB Tools bolsters also lock into this handle, but they will not store inside the end of it.
  - heading: How to use it
    bullets:
      - Tuck the handle along your forearm and against your side. The length works as a lever against the overhang, so let your body hold it rather than your wrist.
      - Check that the back end clears the lathe bed, the banjo, and your body through the whole swing of the cut before you start. On a 14" swing lathe a 23" handle plus the tool is a long sweep.
      - Lock the tool in, then try to twist and pull it by hand before you turn the lathe on.
      - Take the tool out of the handle to sharpen. A 15" Finisher on a 23" handle is awkward at the grinder.
      - Wipe the bolster and the handle socket clean before fitting a tool.
  - heading: Common mistakes
    bullets:
      - Using the long handle for close detail work where it gets in the way. Swap to the 16".
      - Treating the extra leverage as licence for a heavy cut far over the rest. Move the rest in first.
      - Starting the lathe with the bolster only partly twisted home.
      - Leaving a tool stored point-first inside and forgetting it is there.
