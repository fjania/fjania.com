name: Comfort Tool Rest, 12" Wide, Standard Post
brand: Robust Tools
model: RTR-012-CR-SD-AS
category: tool-rest
vendor: The Woodturning Store
url: https://www.thewoodturningstore.com/robust-comfort-tool-rest-12-wide-standard-post/
purchased: '2026-09-15'
image: robust-comfort-rest-12.jpg
summary: >-
  The everyday straight rest. A 12" bar with a hardened steel rod on top that tools glide across and that never
  needs filing, on a 1" post. The profile is relieved underneath so the hand fits around it in an underhand grip
  and the tool handle can drop past 45° for shear cuts.
specs:
  - label: Width
    value: 12"
  - label: Post diameter
    value: 1" (fits the 2014B banjo)
  - label: Post height
    value: 3-3/4"
  - label: Overall height
    value: 5-7/8"
  - label: Top surface
    value: Hardened steel rod, welded to a solid steel body
  - label: Made in
    value: Barneveld, Wisconsin, USA
sections:
  - heading: What it's for
    bullets:
      - General spindle turning. 12" covers most of the 2014B's bed between centers without moving the banjo for every pass.
      - Outside of bowls and platters, where a straight rest set tangent to the curve works well.
      - "Any cut where you drop the handle low: shear scraping, skew planing, and swept-back gouge work."
  - heading: Setting it
    bullets:
      - "Height for gouges and skews on spindles: the top of the rest about 1/8\" to 1/4\" below center so the cutting edge, which sits above the rest, lands at center."
      - "Height for scrapers: top of the rest at center or a hair above, so the edge trails slightly downward."
      - Keep the rest 1/8" to 1/4" from the work and move it in as the diameter shrinks. Rotate the blank by hand before starting.
      - Lock both the banjo and the post firmly; a rest that shifts under a cut is a catch waiting to happen.
  - heading: Care
    bullets:
      - The hardened rod should never need filing. Wipe it with paste wax occasionally so tools slide freely.
      - Keep the post clean so it drops fully into the banjo and seats square.
  - heading: Common mistakes
    bullets:
      - Running the rest too far from the work. Leverage on the tool goes up quickly with overhang.
      - Setting it too high for a gouge, which forces the handle down and turns a cut into a scrape.
