image: axminster-sk100.jpg
summary: >-
  A 100 mm (4") stainless steel geared scroll chuck, bought as a bare body to carry the Axminster jaw sets.
  There are two of these bodies, so two jaw sets can stay mounted and ready, for example the button jaws on
  one and the deep grip jaws on the other. The SE version is a Woodturning Store exclusive with a fixed
  1-1/4" x 8 TPI insert for the 2014B spindle. It ships with accessory mounting jaws but no gripping jaws.
