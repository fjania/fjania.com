purchased: '2026-09-22'
image: hurricane-htt-242sgk.jpg
summary: >-
  The main bowl gouge. A 5/8" bar with a 1/2" deep flute and a swept-back Irish grind, cryogenically treated M2
  from Crown Tools in Sheffield. Roughs and shapes bowls up to the lathe's 14" swing and leaves a good enough
  surface to go straight to a finishing cut.
