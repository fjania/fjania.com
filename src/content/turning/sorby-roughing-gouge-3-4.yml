summary: >-
  The first tool to pick up on any spindle blank. Its wide, deep U-flute takes square stock to a cylinder quickly
  and without splintering. Spindle work only, never bowls.
specs:
  - label: Flute width
    value: 3/4"
  - label: Flute length
    value: 6"
  - label: Steel
