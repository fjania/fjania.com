sections:
  - heading: What it's for
    paragraphs:
      - >-
        This is a handle only. Ashley Harwood designed it for the three tools she uses to turn finials, and all
        three came in the package with it.
    bullets:
      - The 1/2" Push Cut bowl gouge, held directly in the 1/2" collet.
      - The Vortex Tool, a 3/8" bar, held with the 3/8" reducer.
      - The 1/4" Detail Spindle Gouge, held with the 1/4" reducer.
      - Other unhandled tools with a round 1/2", 3/8", or 1/4" shank.
      - Not a bowl-turning handle. At 6" there is no leverage for a tool hanging over the rest.
  - heading: How the collet works
    bullets:
      - The 1/2" collet stays in the handle. For a smaller tool, drop the matching reducer into the collet and slide the tool in.
      - The nut does not have to come all the way off to change tool sizes. Back it off, swap the tool and reducer, and tighten again.
      - The collet and reducers are aluminum so they close easily under hand pressure. Use the Angle Wrench only when a tool slips.
      - The reducer that is not in use stores inside the handle, so it does not get lost in the shavings.
  - heading: How to use it
    bullets:
      - Set the projection before you tighten. The tool slides through the collet, so you can choke the handle up close to the edge for fine detail or leave more bar out for reach.
      - Snug the nut and try to twist the tool by hand before you start the lathe.
      - Hold it like a pencil or in your palm, with the rest close to the work. Guide with your fingers on the rest rather than bracing against your hip.
      - Leave the 1/4" detail gouge in the handle to sharpen it. The 5-3/4" bar is too short to control at the wheel on its own.
      - Brush dust out of the collet and reducers when you change tools so they grip evenly.
  - heading: Common mistakes
    bullets:
      - Clamping a 3/8" or 1/4" tool without its reducer, or leaving a reducer in when fitting the 1/2" gouge.
      - Overtightening with the wrench as a habit. The aluminum collet is made to be closed by hand.
      - Leaving too much of the 1/4" gouge sticking out, which lets the thin bar flex and chatter.
      - Reaching for it on bowl work because the 1/2" gouge is already in it. Use the bolstered 1/2" gouge in the 16" handle instead.
