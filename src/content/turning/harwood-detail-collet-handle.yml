summary: >-
  A 6" aluminum collet handle for finials and fine spindle work. It grips bare round tool shanks of 1/2", 3/8",
  and 1/4" in a hand-tightened collet, so the three detail-package tools share one handle. Short and light enough
  to swing in front of your body, which the long carbon fiber handles cannot do.
