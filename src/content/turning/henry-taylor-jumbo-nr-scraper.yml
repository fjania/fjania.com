name: Jumbo Radius Edge Negative Rake Scraper
brand: Henry Taylor
model: CSUSA 1019290001
category: scraper
vendor: Craft Supplies USA
url: https://woodturnerscatalog.com/products/henry-taylor-m2-hss-jumbo-radius-edge-negative-rake-scraper
purchased: '2026-09-25'
image: henry-taylor-jumbo-nr-scraper.jpg
summary: >-
  A very heavy negative-rake scraper with a gently radiused edge. Negative rake makes it nearly catch-proof,
  so it can refine the inside and outside of bowls and platters with almost no risk, especially in hard,
  dense, or figured wood.
specs:
  - label: Blade
    value: 1-1/2" wide x 3/8" thick x 6-1/2" long
  - label: Edge
    value: Radiused, negative rake (bevel top and bottom)
  - label: Handle
    value: 17" ash with brass ferrule
  - label: Overall length
    value: 27"
  - label: Steel
    value: M2 high-speed steel
  - label: Made in
    value: Sheffield, England
sections:
  - heading: What it's for
    bullets:
      - Final smoothing of platters, bowl interiors, and gently curved surfaces, especially in dense exotics and figured wood that tears under a gouge.
      - Cleaning up rims and flat areas on platters.
      - Reaching well over the rest into a deep bowl. The mass and 27" length keep it stable.
      - Refining acrylic, stabilized blanks, and other brittle materials where a positive-rake scraper chips.
  - heading: How to use it
    bullets:
      - Because of the negative rake, hold the tool flat on the rest with the handle level, not trailing. The top bevel gives the clearance.
      - Set the rest at center. Take featherlight passes and let the burr do the work; you should see fine, dry dust-like shavings, not chips.
      - Only the portion of the radius that matches the curve should contact the wood. Rotate the tool slightly to pick the part of the edge you want.
      - It is a finishing tool only. Shape with the gouge first.
  - heading: Sharpening
    paragraphs:
      - >-
        Two bevels: a lower bevel around 60° to 70° and an upper bevel around 20° to 30°, keeping the included
        angle near 90° or a little less. The small burr raised when grinding the top bevel last is the cutting edge.
    bullets:
      - "Tormek: SVD-110 platform. Grind the lower bevel first at about 65°, flip, and grind the upper bevel at about 25° so the burr forms on top. Sweep across the wheel to follow the radius."
      - Keep the burr tiny. A negative-rake scraper with a large burr cuts aggressively and loses its forgiving nature.
      - The burr is short-lived. Touch up the top bevel every few minutes of finishing work.
  - heading: Common mistakes
    bullets:
      - Trailing the handle high as you would with a conventional scraper. On a negative-rake tool that lifts the burr off the wood and it stops cutting.
      - Using it to remove bulk. It is slow by design.
