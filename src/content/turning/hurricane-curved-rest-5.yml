name: 5" Diameter Curved Tool Rest for Small Bowls, 5" Post
brand: Hurricane Turning Tools
model: HTT-TR-5C-5
category: tool-rest
vendor: The Woodturning Store
url: https://www.thewoodturningstore.com/hurricane-5-diameter-curved-tool-rest-for-small-bowls-5-post-length/
purchased: '2026-09-22'
image: hurricane-curved-rest-5.jpg
summary: >-
  A curved rest that follows the inside of a small bowl so the tool stays supported close to the wall all the way
  to the bottom. Radiused top and bottom edges mean it can be flipped to use the curve either way. Modular: bar,
  post, and washer assemble before first use.
specs:
  - label: Curve diameter
    value: 5"
  - label: Post diameter
    value: 1" nominal (0.997" actual)
  - label: Post length
    value: 5" (4-3/8" post height)
  - label: Overall height
    value: 5-5/8"
  - label: Construction
    value: Steel body, solid steel post, radiused top and bottom edges
sections:
  - heading: What it's for
    bullets:
      - Hollowing and finishing the inside of bowls roughly 5" to 9" in diameter. The curve keeps the gouge or scraper within an inch of the wall where a straight rest would be 3" or more away at the bottom.
      - Interior shear scraping with the finishing scraper and negative-rake scraper.
      - Flipped over, the convex side suits the outside of a small bowl near the foot.
  - heading: Setting it
    bullets:
      - Swing the curve into the bowl with the lathe stopped and set the top about 1/8" below center for the gouge, or at center for scrapers. Check clearance by rotating the bowl by hand; the rim must clear the rest and the banjo.
      - Re-position as the bowl deepens so the tool overhang stays short. The curve lets you get much closer to the bottom than a straight rest, but only if you move it.
      - The longer 5" post gives extra height when the bed extension is used in the low position; drop the banjo or use a shorter setting on the main bed.
  - heading: Care
    bullets:
      - Dress the top edge occasionally with a fine file to remove nicks, then wax it. Unlike the Robust, this top edge is plain steel.
      - Check the post set screw stays tight after assembly.
  - heading: Common mistakes
    bullets:
      - Leaving it in the bowl at a height set for the outside. Interior cuts want the rest a little higher.
      - Starting the lathe without checking that the rim clears the curved bar.
