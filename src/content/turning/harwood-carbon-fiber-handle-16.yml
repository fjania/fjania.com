image: harwood-carbon-fiber-handle-16.jpg
summary: >-
  The shorter of the two carbon fiber handles in the Bowl Turning Package, and the one Ashley Harwood recommends
  for her 1/2" and 5/8" Push Cut bowl gouges. Tools lock in by a bolster with a quick twist, with no set screws
  or hex keys, and a sharp tool can be reversed and stored inside the handle.
specs:
  - label: Length
    value: 16" (one of six stock lengths)
  - label: Grip
    value: Round, 1.4" diameter
  - label: End fitting
    value: 1.5" hex aluminum, keeps the handle from rolling
  - label: Construction
    value: Ten layers of axial and co-axial carbon fiber mesh composite, flex strength 100 to 150 ksi
  - label: Balance
    value: Weighted toward the front, to keep pressure on the tool rest
  - label: Tool fitting
    value: AH bolster, locked and released by hand (U.S. Patent 12427643). Also accepts SB Tools bolsters.
  - label: Bolsters in the package
    value: 1/2", 5/8", 3/8" and 3/4"
  - label: Made in
    value: USA, from USA-made materials
sections:
  - heading: What it's for
    paragraphs:
      - >-
        This is a handle only. It carries any tool that has an AH bolster on its shank. Ashley Harwood recommends
        the 16" length for the 1/2" and 5/8" Push Cut bowl gouges, so it is the everyday handle for bowl work.
    bullets:
      - The 5/8" Push Cut gouge for roughing and shaping, and the 1/2" Push Cut gouge for finishing cuts.
      - The 3/8" bedan. She recommends her 12" handle for that tool, which is not in the shop, so this is the closer of the two handles here.
      - Any of the four bolstered tools fits either handle. Move to the 23" handle when the tool hangs far over the rest.
  - heading: How the bolster system works
    bullets:
      - The tool does not go into the handle directly. A bolster is fixed to the tool's shank, and the bolster seats in the front of the handle and locks with a twist.
      - No set screws or hex keys. The magnetic AH Angle Wrench from the package tightens or loosens a bolster that will not move by hand.
      - A separately bought bolster is glued to the tool with epoxy or another adhesive. The bedan is sold with its bolster already attached.
      - The 1/2", 5/8", and 3/4" bolsters take round shanks of those diameters. The 3/8" bolster is the one on the bedan.
      - The package lists the bolsters with a TDC (thin dense chrome) coating to prevent rust.
      - "Storage: turn the tool around, slide the sharp end into the handle, and twist the bolster to lock it. The edge and your hands are both protected."
      - SB Tools bolsters also lock into this handle, but they will not store inside the end of it.
  - heading: How to use it
    bullets:
      - Wipe the bolster and the handle socket clean before fitting a tool. Grit keeps the bolster from seating.
      - Lock the tool in, then try to twist and pull it by hand before you turn the lathe on.
      - Take the tool out of the handle to sharpen. A bare bar is easier to control on the grinding platform.
      - Hold the handle against your body for push cuts and steer with your hips. The front-weighted balance helps keep the tool down on the rest.
      - The composite does not pass vibration to your hands the way a steel or aluminum handle does, so check the cut by eye and sound as well as feel.
  - heading: Common mistakes
    bullets:
      - Starting the lathe with the bolster only partly twisted home.
      - Storing a tool point-first in the handle and forgetting it is in there. Check before you reach for another tool.
      - Using it for the 3/4" Finisher on a deep bowl. That tool wants the leverage of the 23" handle.
      - Getting epoxy on the outside of a bolster when gluing a tool in, which stops it seating in the handle.
