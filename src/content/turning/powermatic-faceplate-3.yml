summary: >-
  The cast iron faceplate that ships with the lathe. Screws to a flat face of a blank for the most secure hold
  available, with two set screws that lock it to the spindle so it can be run in reverse. Comes with a wrench.
specs:
  - label: Thread
    value: 1-1/4" x 8 TPI, right hand
  - label: Diameter
    value: 3"
  - label: Material
