name: Modular Tool Rest, 1" Post with 4" and 6" Bars
brand: Axminster Woodturning
model: 101833 post, 101837 (100 mm) and 101838 (150 mm) bars
category: tool-rest
vendor: The Woodturning Store
url: https://www.thewoodturningstore.com/axminster-woodturning-tool-post-25-4mm-1-x-140mm/
purchased: '2026-10-06'
image: axminster-modular-tool-rest.jpg
summary: >-
  Two short rests that share one post. A stainless steel 1" post threads into either a 4" or a 6" round
  stainless bar, giving small rests for boxes, finials, pens, and work close to the chuck where the 8" and 12"
  rests are too long to get in. The round bar does not nick like cast iron and lets the tool angle change
  smoothly.
specs:
  - label: Post
    value: 25.4 mm (1") diameter x 140 mm (5-1/2") long, stainless steel (101833)
  - label: Short bar
    value: 100 mm (4") wide (101837)
  - label: Long bar
    value: 150 mm (6") wide (101838)
  - label: Bar section
    value: 19 mm round stainless steel
  - label: Overall height
    value: 5-3/4" with a bar fitted
  - label: Assembly
    value: Bar screws onto the threaded end of the post; spanner flats on the post
  - label: Made in
    value: Axminster, England
sections:
  - heading: What it's for
    bullets:
      - "Small work: pens, finials, knobs, ornaments, and boxes, where a short rest can sit right up against the piece without hitting the chuck or the tailstock."
      - "The 4\" bar across the face of a small box or inside a short recess. The 6\" bar for short spindles and small bowls."
      - Detail work with the small skews and the 1/4" spindle gouge. The round bar gives a single line of contact, so the handle can swing and drop freely.
      - One post serves both bars, and any other Axminster bar (250 mm, 200 mm long reach) will screw onto it later.
  - heading: Setting it
    bullets:
      - Screw the bar onto the post by hand until it seats, then nip it up with a spanner on the post flats. Check it before each session; a bar that unscrews under a cut will shift.
      - The tool bears on the top of a round bar, well back from the edge nearest the work. Set the bar closer to the piece than you would a flat-topped rest to keep the overhang short.
      - "Height: top of the bar 1/8\" to 1/4\" below center for gouges and skews, at center for scrapers. The 5-1/2\" post has plenty of length for the 2014B banjo; lock it at height rather than letting it bottom out."
      - Rotate the work by hand before starting. A short rest tucked in close is easy to set too close to a chuck jaw.
  - heading: Care
    bullets:
      - Stainless steel does not rust and should not need filing. Wipe off resin and wax the bar so tools slide.
      - Keep the thread and the seating faces clean so the bar pulls up square to the post.
  - heading: Common mistakes
    bullets:
      - Swapping bars and leaving the new one only finger tight.
      - Using the 4" bar for a long pass and running the tool off the end of the rest. Change to the 6" bar or the 12" Robust.
      - Setting the height as for a flat rest. The contact point on a round bar moves as the handle drops, so check the cutting height with the tool in position.
