summary: >-
  A 3/8" square bar ground to a two-bevel chisel edge. It parts and sizes like the 1/8" Sorby but takes a kerf
  three times as wide, and the square section and wide edge let it roll beads and peel tenons in one pass.
  Cryogenically treated M2 from Crown Tools in Sheffield.
