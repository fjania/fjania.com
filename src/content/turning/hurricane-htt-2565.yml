purchased: '2026-09-24'
image: hurricane-htt-2565.jpg
summary: >-
  A heavy curved-profile scraper for the inside of bowls. The 3/8" thick section damps chatter when reaching
  over the rest, and the radiused edge matches the curve of a bowl interior to remove gouge ridges.
specs:
  - label: Width
    value: 1"
  - label: Thickness
    value: 3/8"
  - label: Usable length
    value: 6-1/2"
  - label: Profile
    value: Curved (radiused) edge for bowl interiors
  - label: Handle
    value: 14" stained beech with brass ferrule
